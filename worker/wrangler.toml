name = "sharing-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# 前端網址（GitHub Pages），多個用逗號分隔
ALLOWED_ORIGINS = "https://jonwenjen.github.io"
LIFF_ID = "2011659315-MlgnLpFZ"
LINE_LOGIN_CHANNEL_ID = "2011659315"
DEV_MODE = "0"
# 管理員（可看到並進入所有帳本）的 LINE userId，多位用逗號分隔；在網頁首頁點右上角頭像可複製自己的 ID
ADMIN_USER_IDS = "U944c699399ccfbd4b2f36bc2f402100e"

# 機密請用 `npx wrangler secret put` 設定：
#   LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "sharing"
database_id = "a08deb83-80b2-439c-8f2a-5797796ea1ae"
